<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="ftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Tuning sliders / weights -->
  <line x1="25" y1="20" x2="25" y2="80" stroke="url(#ftGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="url(#ftGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="20" x2="75" y2="80" stroke="url(#ftGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Dials / Nodes -->
  <circle cx="25" cy="40" r="8" fill="#10b981" filter="url(#ftGlow)"/>
  <circle cx="25" cy="40" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="62" r="8" fill="#06b6d4" filter="url(#ftGlow)"/>
  <circle cx="50" cy="62" r="3.5" fill="#ffffff"/>
  <circle cx="75" cy="32" r="8" fill="#8b5cf6" filter="url(#ftGlow)"/>
  <circle cx="75" cy="32" r="3.5" fill="#ffffff"/>
  <!-- Sparkle indicator -->
  <path d="M50 16 L52 21 L57 23 L52 25 L50 30 L48 25 L43 23 L48 21 Z" fill="#38bdf8" opacity="0.9"/>
</svg>